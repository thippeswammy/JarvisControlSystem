# ============================================================
# Jarvis v2 — Master Configuration
# ============================================================

jarvis:
  input_mode: text                   # text | voice | api
  voice_confidence_threshold: 0.70   # below this → ask to confirm

# ── LLM Router ──────────────────────────────────────────────
llm:
  primary: nvidia                    # NVIDIA NIM cloud primary
  fallback: local                    # Local Ollama fallback
  emergency_fallback: mock           # always works

  backends:
    # Cloud: NVIDIA NIM (OpenAI-compatible) — open-weight model, free API tier
    nvidia:
      model: "openai/gpt-oss-20b"
      api_key: "${NVIDIA_API_KEY}"
      base_url: "https://integrate.api.nvidia.com/v1"
      max_tokens: 6000                   # gpt-oss emits a reasoning trace before the JSON answer
      temperature: 0.3
      top_p: 0.8
      timeout_seconds: 30

    # Cloud: OpenRouter (OpenAI-compatible) — free-tier open-weight model
    openrouter:
      model: "google/gemma-4-26b-a4b-it:free"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      max_tokens: 4096
      temperature: 0.3
      top_p: 0.9
      timeout_seconds: 30

    # Local: Ollama (offline fallback)
    local:
      engine: ollama
      api_url: "http://localhost:11434/v1"
      model: "qwen3.5:2b"
      fallback_model: "qwen3.5:2b"   # stable for 4GB VRAM
      max_tokens: 8000
      temperature: 0.1
      timeout_seconds: 60
      auto_pull: false

    # Cloud: OpenAI or Anthropic
    openai:
      provider: openai
      api_key: "${OPENAI_API_KEY}"
      model: gpt-4o-mini
      max_tokens: 300
      temperature: 0.1
      timeout_seconds: 20

    # Tunneled: self-hosted model via ngrok / cloudflared / bore.pub
    tunneled:
      api_url: "https://petri-crowbar-occupier.ngrok-free.dev/v1"
      api_key: ""
      model: "gemma4:e2b"
      max_tokens: 101072
      temperature: 0.6
      timeout_seconds: 45

    mock:
      enabled: true

  # Task-Specific Routing
  routing:
    nlu: nvidia
    goal_understanding: nvidia
    action_planning: nvidia
    agent_execution: nvidia
    peer_review: nvidia
    recovery: nvidia

# ── Channels ────────────────────────────────────────────────
channels:
  cli:
    enabled: true
  
  telegram:
    enabled: true
    token: "8693706700:AAERwET5RcROo91AbQ9K2-yv1DPx_VwhH40"
    allowed_chat_ids: []               # empty = all

  telegram_test:
    enabled: false
  
  voice:
    enabled: false

# ── Memory ──────────────────────────────────────────────────
memory:
  root_dir: ./memory
  db_path: ./memory/jarvis_v2.db
  episodic_per_channel: true          # isolate episodic memory per channel
  confidence_decay_per_fail: 0.05
  confidence_boost_per_success: 0.02
  min_confidence_threshold: 0.30
